[package]
name = "super-mic"
version = "0.1.0"
edition = "2024"
description = "Colours a Winry315 keypad's backlight to show microphone mute/in-use state"
readme = "README.md"
publish = false

[dependencies]
evdev = "0.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"

[profile.release]
lto = true
strip = true
